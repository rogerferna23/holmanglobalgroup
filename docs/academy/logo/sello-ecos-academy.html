<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Sello ECOS Academy</title>
<link href="https://fonts.googleapis.com/css2?family=Questrial&family=Josefin+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; }
  html, body { width:1200px; height:1200px; background:transparent; }
  body { display:flex; align-items:center; justify-content:center; }
  body.oscuro { background:radial-gradient(ellipse 60% 60% at 50% 45%, #141B25, #0B1016 75%); }
  body.claro { background:transparent; }
  svg { width:1000px; height:1000px; }
</style>
</head>
<body>
<!--
  Sello de ECOS Academy. Geometría:
  aro exterior r=194 · aro punteado r=184 · círculo interior r=120
  la franja del texto va de 120 a 184 (centro r=152); el texto de arriba
  tiene su base en r=144 (las letras crecen hacia afuera) y el de abajo en
  r=159 (crecen hacia adentro), así los dos quedan centrados en la franja.
  Versión por ?v=oscuro | transparente | claro
-->
<svg viewBox="0 0 400 400" role="img" aria-label="ECOS Academy · Holman Global Group">
  <defs>
    <linearGradient id="oro" gradientUnits="userSpaceOnUse" x1="70" y1="60" x2="330" y2="340">
      <stop offset="0" stop-color="#FFE38A"/><stop offset=".35" stop-color="#F0B800"/>
      <stop offset=".62" stop-color="#B58600"/><stop offset=".82" stop-color="#F7CF4A"/><stop offset="1" stop-color="#C99400"/>
    </linearGradient>
    <path id="arriba" d="M56 200 A144 144 0 0 1 344 200"/>
    <path id="abajo" d="M41 200 A159 159 0 0 0 359 200"/>
  </defs>

  <circle cx="200" cy="200" r="194" fill="var(--fondo)" stroke="url(#oro)" stroke-width="4"/>
  <circle cx="200" cy="200" r="184" fill="none" stroke="#F0B800" stroke-width="1.2" stroke-dasharray="2 5" opacity=".75"/>

  <text font-family="Josefin Sans" font-size="23" font-weight="600" fill="#F0B800" letter-spacing="7" text-anchor="middle">
    <textPath href="#arriba" startOffset="50%">ECOS ACADEMY</textPath>
  </text>
  <text font-family="Josefin Sans" font-size="18.5" font-weight="400" fill="var(--texto)" letter-spacing="5.5" text-anchor="middle">
    <textPath href="#abajo" startOffset="50%">HOLMAN GLOBAL GROUP</textPath>
  </text>

  <path d="M48 200 l7 -7 7 7 -7 7 Z" fill="#F0B800"/>
  <path d="M338 200 l7 -7 7 7 -7 7 Z" fill="#F0B800"/>

  <circle cx="200" cy="200" r="120" fill="var(--interior)" stroke="url(#oro)" stroke-width="2"/>
  <circle cx="200" cy="200" r="112" fill="none" stroke="#F0B800" stroke-width=".8" opacity=".35"/>

  <text x="204" y="214" text-anchor="middle" font-family="Questrial" font-size="58" letter-spacing="9" fill="var(--centro)">ECOS</text>
  <path d="M146 242 H190 M210 242 H254" stroke="#F0B800" stroke-width="1.5"/>
  <path d="M200 235 l7 7 -7 7 -7 -7 Z" fill="#F0B800"/>
</svg>
<script>
  const v = new URLSearchParams(location.search).get('v') || 'oscuro';
  document.body.className = v;
  const s = document.querySelector('svg').style;
  const paleta = {
    oscuro:       { fondo:'#0E141C', interior:'#121A24', texto:'#D9DDE3', centro:'#FFFFFF' },
    transparente: { fondo:'none',    interior:'rgba(255,255,255,.03)', texto:'#D9DDE3', centro:'#FFFFFF' },
    claro:        { fondo:'none',    interior:'rgba(240,184,0,.08)', texto:'#2A313C', centro:'#0B1016' },
  }[v];
  for (const [k, val] of Object.entries(paleta)) s.setProperty('--' + k, val);
</script>
</body>
</html>
