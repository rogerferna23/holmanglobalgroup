# Mantiene despierto el proyecto de Supabase.
#
# El plan gratuito pausa un proyecto tras ~7 días con poca actividad de usuario.
# El sitio ya consulta la base en cada visita (las reseñas del inicio), así que
# con tráfico normal no se pausa. Esto es el seguro para las semanas flojas.
#
# Configurar una sola vez en GitHub → Settings → Secrets and variables → Actions
# → pestaña "Variables":
#   SUPABASE_URL       https://xxxxx.supabase.co
#   SUPABASE_ANON_KEY  eyJ...   (la publishable/anon, la misma que va en el sitio)

name: Supabase despierta

on:
  schedule:
    - cron: "0 13 */3 * *"   # cada 3 días, 8:00 a.m. hora de Colombia
  workflow_dispatch:          # y a mano desde la pestaña Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar la base
        env:
          URL: ${{ vars.SUPABASE_URL }}
          KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "Faltan las variables SUPABASE_URL y SUPABASE_ANON_KEY del repositorio."
            echo "Se ponen en Settings → Secrets and variables → Actions → Variables."
            exit 1
          fi
          CODE=$(curl -s -o /tmp/r.json -w '%{http_code}' \
            "$URL/rest/v1/products?select=id&limit=1" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" --max-time 30)
          echo "Respuesta: $CODE"
          if [ "$CODE" != "200" ]; then
            echo "La base no respondió como se esperaba:"; cat /tmp/r.json; exit 1
          fi
          echo "Base activa. Queda despierta otros 7 días."
