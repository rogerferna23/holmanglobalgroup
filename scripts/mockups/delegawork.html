<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<!-- Mockups de DelegaWork para la vitrina de /tienda, con imágenes reales de
     delegawork.com (capturas/delegawork/: el panel es su product-dashboard.png;
     las tarjetas de módulos salen de la página con capturar.mjs). El chat de
     WhatsApp es de muestra. Se fotografía con render.sh delegawork. -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=block" rel="stylesheet">
<style>
  :root {
    --violeta: #7C3AED;
    --violeta-2: #8B5CF6;
    --lila: #C4B5FD;
    --grad: linear-gradient(135deg, #8B5CF6 0%, #7C3AED 55%, #3B6FF6 100%);
    --panel: #0F1D44;
    --sans: "Inter", Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: transparent; width: 100%; height: 100%; overflow: hidden; }
  body { font-family: var(--sans); color: #E8ECF3; position: relative; }
  .escena { display: none; position: absolute; inset: 0; }
  body[data-e="hero"] #hero, body[data-e="basico"] #basico, body[data-e="starter"] #starter,
  body[data-e="pro"] #pro, body[data-e="elite"] #elite { display: block; }
  .sombra { filter: drop-shadow(0 40px 50px rgba(0,0,0,.35)) drop-shadow(0 8px 14px rgba(0,0,0,.22)); }

  .laptop { position: absolute; }
  .laptop .tapa { background: #121314; border-radius: 22px 22px 0 0; padding: 18px 18px 22px; box-shadow: inset 0 0 0 2px #2b2d30; }
  .laptop .pantalla { background: var(--panel); border-radius: 4px; overflow: hidden; position: relative; aspect-ratio: 16/10; }
  .laptop .pantalla img { width: 100%; height: auto; display: block; }
  .laptop .base { height: 22px; margin: 0 -6%; background: linear-gradient(180deg, #d9dade, #a9abb1 70%, #8d8f95); border-radius: 0 0 26px 26px; position: relative; }
  .laptop .base::before { content: ""; position: absolute; left: 50%; top: 0; width: 16%; height: 8px; transform: translateX(-50%); background: #b9bbc0; border-radius: 0 0 10px 10px; }
  .phone { position: absolute; background: #121314; border-radius: 54px; padding: 13px; box-shadow: inset 0 0 0 2px #34363a; }
  .phone .pantalla { border-radius: 42px; overflow: hidden; height: 100%; position: relative; }
  .phone .isla { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); width: 30%; height: 26px; background: #050505; border-radius: 20px; z-index: 5; }

  /* Tarjetas reales de delegawork.com */
  .pieza { position: absolute; border-radius: 22px; overflow: hidden; box-shadow: 0 0 0 1px rgba(139,92,246,.35), 0 30px 60px rgba(0,0,0,.45); background: #0c0f14; }
  .pieza img { display: block; width: 100%; height: auto; }

  .dw { display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 600; color: #fff; letter-spacing: -.01em; }
  .dw img { width: 30px; height: 30px; }
  .dw b { font-weight: 600; color: var(--violeta-2); }

  /* Chat con Sofía por WhatsApp (muestra) */
  .wa { height: 100%; display: flex; flex-direction: column; background: #0B141A; }
  .wa-top { background: #1F2C34; padding: 56px 16px 12px; display: flex; gap: 10px; align-items: center; font-size: 13px; color: #fff; }
  .wa-top i { width: 34px; height: 34px; border-radius: 50%; background: var(--grad); display: grid; place-items: center; font-style: normal; font-weight: 700; }
  .wa-top small { display: block; font-size: 9px; color: #8FA0AA; }
  .wa-body { flex: 1; padding: 14px 12px; display: flex; flex-direction: column; gap: 9px; font-size: 11.5px; line-height: 1.4; color: #E9EDEF; }
  .msg { max-width: 84%; padding: 8px 10px; border-radius: 10px; background: #202C33; }
  .msg.yo { align-self: flex-end; background: #005C4B; }
  .msg small { display: block; text-align: right; font-size: 8px; color: #8FA0AA; margin-top: 3px; }
  .msg .ia { font-size: 8px; letter-spacing: .12em; text-transform: uppercase; color: var(--lila); display: block; margin-bottom: 3px; font-weight: 600; }
  .slots { display: flex; gap: 6px; margin-top: 7px; flex-wrap: wrap; }
  .slots span { padding: 5px 8px; border-radius: 7px; border: 1px solid #3a2f5c; color: var(--lila); font-size: 10px; }
  .slots span.on { background: var(--violeta); border-color: var(--violeta); color: #fff; }
  .conf { margin-top: 7px; padding: 8px; border-radius: 8px; background: #16232B; border-left: 3px solid #22C55E; font-size: 10.5px; }
  .dia { align-self: center; font-size: 9px; color: #8FA0AA; background: #1A262D; padding: 4px 10px; border-radius: 6px; }
  .wa-pie { display: flex; gap: 8px; align-items: center; padding: 10px 12px 22px; }
  .wa-pie span { flex: 1; background: #1F2C34; border-radius: 20px; padding: 10px 14px; font-size: 11px; color: #8FA0AA; }
  .wa-pie i { width: 34px; height: 34px; border-radius: 50%; background: #00A884; }

  /* Cifra del plan */
  /* Oscura (oct 2026): la blanca chillaba sobre la tienda negra. */
  .cifra { position: absolute; background: radial-gradient(120% 90% at 0% 0%, rgba(139,92,246,.22) 0%, transparent 60%), #0c0f14; color: #fff; border-radius: 22px; padding: 24px 28px; box-shadow: 0 0 0 1px rgba(139,92,246,.45), 0 30px 60px rgba(0,0,0,.5); width: 320px; }
  .cifra p { font-size: 13px; color: #A3A8C3; margin-top: 16px; }
  .cifra strong { display: block; font-size: 84px; line-height: .95; font-weight: 700; letter-spacing: -.05em; margin: 4px 0 6px; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .cifra span { font-size: 15px; font-weight: 600; }
  .cifra .barra { height: 8px; border-radius: 8px; background: #221C3A; margin-top: 16px; overflow: hidden; }
  .cifra .barra i { display: block; height: 100%; width: var(--w); background: var(--grad); border-radius: 8px; }
</style>
</head>
<body>

<template id="t-panel"><img src="capturas/delegawork/panel.jpg" alt=""></template>

<template id="t-chat">
  <div class="wa">
    <div class="wa-top"><i>S</i><div>Tu negocio<small>Sofía · asistente con IA · en línea</small></div></div>
    <div class="wa-body">
      <div class="msg yo">Hola, buenas noches. ¿Tienen cita para esta semana?<small>11:42 p. m.</small></div>
      <div class="msg"><span class="ia">Sofía</span>¡Hola, Laura! Claro que sí 😊 Tengo estos espacios:<div class="slots"><span>Jue 9:00</span><span class="on">Jue 10:30</span><span>Vie 4:00</span></div><small>11:42 p. m.</small></div>
      <div class="msg yo">El jueves a las 10:30 🙌<small>11:43 p. m.</small></div>
      <div class="msg"><span class="ia">Sofía</span>¡Listo! Te espero el jueves.<div class="conf">✓ Cita agendada · jueves 10:30 a. m.<br>Te recuerdo un día antes.</div><small>11:43 p. m.</small></div>
      <span class="dia">Miércoles</span>
      <div class="msg"><span class="ia">Recordatorio automático</span>Laura, te espero mañana a las 10:30 a. m. ¿Confirmas?<small>10:00 a. m.</small></div>
      <div class="msg yo">¡Confirmada! 😊<small>10:04 a. m.</small></div>
    </div>
    <div class="wa-pie"><span>Mensaje</span><i></i></div>
  </div>
</template>

<template id="t-cifra">
  <span class="dw"><img src="capturas/delegawork/logo-icon.svg" alt="">Delega<b>Work</b></span>
  <p>Sofía atiende</p>
  <strong data-n></strong>
  <span>clientes</span>
  <div class="barra"><i></i></div>
</template>

<!-- Hero 2200 × 1500: el panel real, Sofía conectando todo y el chat -->
<section class="escena" id="hero">
  <div class="pieza" style="left:60px;top:250px;width:520px;transform:rotate(-4deg)"><img src="capturas/delegawork/sofia-hub.jpg" alt=""></div>
  <div class="laptop sombra" style="left:420px;top:110px;width:1320px">
    <div class="tapa"><div class="pantalla" data-t="t-panel"></div></div><div class="base"></div>
  </div>
  <div class="pieza" style="left:200px;top:930px;width:600px;transform:rotate(-2deg)"><img src="capturas/delegawork/meet.jpg" alt=""></div>
  <div class="phone sombra" style="left:1700px;top:520px;width:410px;height:880px;transform:rotate(4deg)"><span class="isla"></span><div class="pantalla" data-t="t-chat"></div></div>
</section>

<!-- Básico: Sofía atiende -->
<section class="escena" id="basico">
  <div class="phone sombra" style="left:200px;top:60px;width:420px;height:900px;transform:rotate(-3deg)"><span class="isla"></span><div class="pantalla" data-t="t-chat"></div></div>
  <div class="pieza" style="left:700px;top:130px;width:720px;transform:rotate(2deg)"><img src="capturas/delegawork/sofia-chat.jpg" alt=""></div>
  <div class="cifra" style="left:1000px;top:560px" data-t="t-cifra" data-n="100" data-w="10%"></div>
</section>

<!-- Starter: WhatsApp, CRM y agenda -->
<section class="escena" id="starter">
  <div class="pieza" style="left:560px;top:80px;width:700px;transform:rotate(-3deg)"><img src="capturas/delegawork/crm.jpg" alt=""></div>
  <div class="pieza" style="left:760px;top:420px;width:620px;transform:rotate(3deg)"><img src="capturas/delegawork/meet.jpg" alt=""></div>
  <div class="phone sombra" style="left:150px;top:90px;width:410px;height:880px;transform:rotate(-4deg)"><span class="isla"></span><div class="pantalla" data-t="t-chat"></div></div>
  <div class="cifra" style="left:1180px;top:140px;transform:rotate(4deg)" data-t="t-cifra" data-n="300" data-w="30%"></div>
</section>

<!-- Pro: el panel, CRM, agenda y WhatsApp juntos -->
<section class="escena" id="pro">
  <div class="laptop sombra" style="left:220px;top:60px;width:1140px">
    <div class="tapa"><div class="pantalla" data-t="t-panel"></div></div><div class="base"></div>
  </div>
  <div class="pieza" style="left:40px;top:470px;width:560px;transform:rotate(-4deg)"><img src="capturas/delegawork/crm.jpg" alt=""></div>
  <div class="pieza" style="left:880px;top:560px;width:500px;transform:rotate(3deg)"><img src="capturas/delegawork/meet.jpg" alt=""></div>
  <div class="phone sombra" style="left:1260px;top:250px;width:340px;height:730px;transform:rotate(5deg)"><span class="isla"></span><div class="pantalla" data-t="t-chat"></div></div>
  <div class="cifra" style="left:520px;top:640px" data-t="t-cifra" data-n="600" data-w="60%"></div>
</section>

<!-- Elite: todo el sistema -->
<section class="escena" id="elite">
  <div class="pieza" style="left:40px;top:120px;width:440px;transform:rotate(-5deg)"><img src="capturas/delegawork/sofia-hub.jpg" alt=""></div>
  <div class="laptop sombra" style="left:330px;top:60px;width:1080px">
    <div class="tapa"><div class="pantalla" data-t="t-panel"></div></div><div class="base"></div>
  </div>
  <div class="pieza" style="left:120px;top:660px;width:540px;transform:rotate(-2deg)"><img src="capturas/delegawork/voice.jpg" alt=""></div>
  <div class="phone sombra" style="left:1220px;top:300px;width:350px;height:760px;transform:rotate(4deg)"><span class="isla"></span><div class="pantalla" data-t="t-chat"></div></div>
  <div class="cifra" style="left:720px;top:700px" data-t="t-cifra" data-n="1.000" data-w="100%"></div>
</section>

<script>
  document.body.dataset.e = (location.hash || "#hero").slice(1);
  document.querySelectorAll("[data-t]").forEach((el) => {
    el.appendChild(document.getElementById(el.dataset.t).content.cloneNode(true));
    if (el.dataset.n) {
      el.querySelector("[data-n]").textContent = el.dataset.n;
      el.querySelector(".barra i").style.setProperty("--w", el.dataset.w);
    }
  });
</script>
</body>
</html>
