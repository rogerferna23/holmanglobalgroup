<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<!-- Mockups de Growth System para /tienda (nov 2026). «Raíz · Café de origen»
     es una marca de muestra (no existe) que ya vende y quiere vender cada mes.
     El panel de DelegaWork es la captura real (capturas/delegawork/). DelegaSales
     es ilustración con la guía de marca de Delega Sales (DelegaWork/…pdf). Se fotografía con render.sh growth. -->
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@300;400;500;600&display=block" rel="stylesheet">
<style>
  :root {
    --terra: #C8693F;
    --terra-2: #E08A5E;
    --crema: #F3E6D3;
    --noche: #16110E;
    --noche-2: #231A15;
    --noche-3: #2F241D;
    --verde: #6FCF8E;
    --gris: #B9A99A;
    --gris-2: #8C7D70;
    --blanco: #FFFFFF;
    --display: "Fraunces", Georgia, serif;
    --sans: "Inter", Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: transparent; width: 100%; height: 100%; overflow: hidden; }
  body { font-family: var(--sans); color: var(--crema); position: relative; }
  .escena { display: none; position: absolute; inset: 0; }
  body[data-e="hero"] #hero, body[data-e="starter"] #starter,
  body[data-e="pro"] #pro, body[data-e="elite"] #elite, body[data-e="delegasales"] #delegasales { display: block; }
  .sombra { filter: drop-shadow(0 40px 50px rgba(0,0,0,.35)) drop-shadow(0 8px 14px rgba(0,0,0,.22)); }

  /* ---------- Marca de muestra ---------- */
  .logo { display: inline-flex; align-items: center; gap: .4em; color: var(--crema); }
  .logo svg { width: 1.15em; height: 1.15em; color: var(--terra); }
  .logo b { font-family: var(--display); font-weight: 600; font-size: 1em; letter-spacing: -.01em; }
  .kick { font-size: 9px; letter-spacing: .26em; text-transform: uppercase; font-weight: 600; color: var(--terra-2); }
  .sube { color: var(--verde); font-weight: 600; }

  /* ---------- Dispositivos (como marca.html) ---------- */
  .laptop { position: absolute; }
  .laptop .tapa { background: #121314; border-radius: 22px 22px 0 0; padding: 18px 18px 22px; box-shadow: inset 0 0 0 2px #2b2d30; }
  .laptop .pantalla { background: var(--noche); border-radius: 4px; overflow: hidden; position: relative; aspect-ratio: 16/10; }
  .laptop .pantalla > img { width: 100%; height: 100%; object-fit: cover; object-position: top left; display: block; }
  .laptop .base { height: 22px; margin: 0 -6%; background: linear-gradient(180deg, #d9dade, #a9abb1 70%, #8d8f95); border-radius: 0 0 26px 26px; position: relative; }
  .laptop .base::before { content: ""; position: absolute; left: 50%; top: 0; width: 16%; height: 8px; transform: translateX(-50%); background: #b9bbc0; border-radius: 0 0 10px 10px; }
  .phone { position: absolute; background: #121314; border-radius: 54px; padding: 13px; box-shadow: inset 0 0 0 2px #34363a; }
  .phone .pantalla { background: var(--noche); border-radius: 42px; overflow: hidden; height: 100%; position: relative; }
  .phone .isla { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); width: 30%; height: 26px; background: #050505; border-radius: 20px; z-index: 5; }
  .tablet { position: absolute; background: #121314; border-radius: 34px; padding: 16px; box-shadow: inset 0 0 0 2px #34363a; }
  .tablet .pantalla { background: var(--noche); border-radius: 20px; height: 100%; overflow: hidden; padding: 30px 32px; display: flex; flex-direction: column; gap: 18px; }

  /* ---------- Reporte del mes ---------- */
  .rp-cab { display: flex; justify-content: space-between; align-items: center; }
  .rp-cab .logo { font-size: 20px; }
  .rp-cab > span:last-child { font-size: 10px; letter-spacing: .2em; text-transform: uppercase; color: var(--gris); }
  .rp-h { font-family: var(--display); font-weight: 600; font-size: 30px; line-height: 1.08; color: var(--blanco); letter-spacing: -.01em; }
  .rp-h em { font-style: normal; color: var(--terra-2); }
  .kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .kpi { background: var(--noche-2); border: 1px solid rgba(255,255,255,.06); border-radius: 14px; padding: 14px 16px; font-size: 10px; color: var(--gris); }
  .kpi b { display: block; font-family: var(--display); font-weight: 600; font-size: 26px; color: var(--blanco); margin: 4px 0 2px; }
  .kpi.on { background: linear-gradient(160deg, #3A2418, var(--noche-2)); border-color: rgba(200,105,63,.45); }
  .barras { flex: 1; display: grid; grid-template-columns: repeat(6, 1fr); gap: 14px; align-items: end; padding: 14px 6px 0; border-bottom: 1px solid rgba(255,255,255,.08); position: relative; min-height: 180px; }
  .barras .base { position: absolute; left: 0; right: 0; border-top: 1px dashed rgba(243,230,211,.4); font-size: 9px; color: var(--gris); text-align: right; padding-top: 4px; }
  .barras i { display: block; border-radius: 8px 8px 0 0; background: var(--noche-3); position: relative; }
  .barras i.n { background: linear-gradient(180deg, var(--terra-2), var(--terra)); }
  .barras i span { position: absolute; top: -18px; left: 0; right: 0; text-align: center; font-style: normal; font-size: 9px; color: var(--gris); }
  .meses { display: grid; grid-template-columns: repeat(6, 1fr); gap: 14px; padding: 6px 6px 0; font-size: 9px; color: var(--gris-2); text-align: center; }
  .ley { display: flex; gap: 16px; font-size: 10px; color: var(--gris); }
  .ley span::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; background: var(--c); }

  /* ---------- Instagram ---------- */
  .ig { padding: 50px 14px 0; font-size: 11px; color: var(--blanco); }
  .ig-top { display: flex; justify-content: space-between; align-items: center; font-weight: 600; font-size: 14px; padding: 0 4px 12px; }
  .ig-perfil { display: flex; align-items: center; gap: 16px; padding: 0 4px; }
  .ig-avatar { width: 74px; height: 74px; border-radius: 50%; background: var(--noche-2); display: grid; place-items: center; box-shadow: 0 0 0 2px var(--terra), 0 0 0 5px var(--noche); flex: none; }
  .ig-avatar svg { width: 40px; color: var(--terra); }
  .ig-nums { display: flex; gap: 18px; text-align: center; }
  .ig-nums b { display: block; font-size: 15px; }
  .ig-bio { padding: 12px 4px; line-height: 1.45; }
  .ig-bio span { color: var(--terra-2); }
  .ig-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; margin: 0 -14px; }
  .post { aspect-ratio: 4/5; position: relative; overflow: hidden; display: flex; flex-direction: column; justify-content: center; padding: 10px; font-family: var(--display); line-height: 1.08; }
  .post.n { background: var(--noche-2); color: var(--crema); }
  .post.t { background: var(--terra); color: var(--blanco); }
  .post.c { background: var(--crema); color: var(--noche); }
  .post small { font-family: var(--sans); font-size: 6px; letter-spacing: .2em; text-transform: uppercase; opacity: .75; margin-bottom: 6px; }
  .post .q { font-size: 14px; font-weight: 600; }
  .post .q em { font-style: normal; color: var(--terra-2); }
  .post.c .q em { color: var(--terra); }
  .post .num { font-size: 30px; font-weight: 600; }
  .post .reel { position: absolute; top: 8px; right: 8px; width: 0; height: 0; border-left: 7px solid currentColor; border-top: 5px solid transparent; border-bottom: 5px solid transparent; opacity: .8; }
  .post .taza { position: absolute; right: -14px; bottom: -14px; width: 56px; height: 56px; border-radius: 50%; border: 2px solid currentColor; opacity: .25; }

  /* ---------- Landing en el celular ---------- */
  .lnd { padding: 54px 22px 20px; display: flex; flex-direction: column; height: 100%; }
  .lnd .logo { font-size: 20px; }
  .lnd .foto { margin-top: 18px; height: 230px; border-radius: 22px; background:
    radial-gradient(60% 60% at 50% 55%, rgba(224,138,94,.55), transparent 70%),
    radial-gradient(30% 30% at 50% 55%, #4A2E1F 0 60%, transparent 62%),
    linear-gradient(160deg, var(--noche-3), var(--noche-2)); position: relative; }
  .lnd .foto::after { content: ""; position: absolute; left: 50%; top: 52%; width: 92px; height: 92px; transform: translate(-50%, -50%); border-radius: 50%; border: 8px solid var(--crema); background: radial-gradient(circle at 42% 40%, #C98A5C 0 12%, #7A4325 30%, #3B2014 70%); box-shadow: 0 18px 30px rgba(0,0,0,.45); }
  .lnd h1 { font-family: var(--display); font-weight: 600; font-size: 28px; line-height: 1.06; color: var(--blanco); margin: 18px 0 10px; }
  .lnd h1 em { font-style: normal; color: var(--terra-2); }
  .lnd p { font-size: 12px; line-height: 1.5; color: var(--gris); }
  .btn { display: block; text-align: center; margin-top: 18px; padding: 13px 22px; border-radius: 12px; background: var(--terra); color: #fff; font-size: 13px; font-weight: 500; box-shadow: 0 10px 24px rgba(200,105,63,.35); }
  .btn.wa { background: #25D366; box-shadow: 0 10px 24px rgba(37,211,102,.25); color: #06210F; }
  .lnd .prueba { margin-top: 14px; font-size: 11px; color: var(--gris); text-align: center; }

  /* ---------- Mensajes listos (agenda de contactos) ---------- */
  .ml { padding: 54px 16px 16px; height: 100%; display: flex; flex-direction: column; gap: 12px; }
  .ml-h { font-family: var(--display); font-weight: 600; font-size: 22px; color: var(--blanco); line-height: 1.1; }
  .ml-sub { font-size: 11px; color: var(--gris); }
  .ml-tabs { display: flex; gap: 6px; font-size: 10px; }
  .ml-tabs span { padding: 6px 10px; border-radius: 99px; background: var(--noche-2); color: var(--gris); }
  .ml-tabs span.on { background: var(--terra); color: #fff; }
  .ct { display: flex; gap: 10px; align-items: center; padding: 10px; border-radius: 14px; background: var(--noche-2); }
  .ct i { width: 34px; height: 34px; border-radius: 50%; background: var(--c); flex: none; display: grid; place-items: center; font-style: normal; font-size: 12px; font-weight: 600; color: var(--noche); }
  .ct div { flex: 1; min-width: 0; font-size: 11px; color: var(--blanco); }
  .ct small { display: block; font-size: 9.5px; color: var(--gris); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
  .ct b { font-size: 9px; padding: 6px 9px; border-radius: 99px; background: #25D366; color: #06210F; font-weight: 600; flex: none; }
  .ct b.hecho { background: transparent; color: var(--verde); border: 1px solid rgba(111,207,142,.45); }

  /* ---------- DelegaSales: guía de marca de Holman (nov 2026) ----------
     Navy #0B1016 de fondo, caja del logo #0E1A33 con borde #2A3550, esfera
     azul con halo morado, azul #2B5FE0/#5E78EB solo de Sales, gris #94A3B8,
     Inter para todo y etiquetas en mayúsculas con .12em. */
  .ds { position: absolute; inset: 0; display: grid; grid-template-columns: 180px 1fr; font-size: 11px; font-family: "Inter", system-ui, sans-serif; background: #0B1016; color: #94A3B8; }
  .ds-lado { border-right: 1px solid #1B2436; padding: 20px 14px; display: flex; flex-direction: column; gap: 6px; }
  .ds-logo { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
  .ds-lado .ds-caja { padding: 0; }
  .ds-caja { width: 34px; height: 34px; border-radius: 9px; background: #0E1A33; border: 1.5px solid #2A3550; display: grid; place-items: center; flex: none; }
  .ds-caja svg { width: 26px; height: 26px; }
  .ds-word { font-size: 15px; color: #FFFFFF; font-weight: 500; letter-spacing: -.01em; }
  .ds-word b { font-weight: 700; color: #5E78EB; }
  .ds-lado span { padding: 8px 10px; border-radius: 8px; }
  .ds-lado span.on { background: #0E1A33; color: #FFFFFF; box-shadow: inset 2px 0 0 #2B5FE0; }
  .ds-main { padding: 22px 26px; display: flex; flex-direction: column; gap: 14px; position: relative;
    background-image: radial-gradient(circle, rgba(71,85,105,.35) 1.4px, transparent 1.6px); background-size: 34px 34px; background-position: 10px 10px; }
  .ds-top { display: flex; justify-content: space-between; align-items: center; }
  .ds-eti { font-size: 9px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: #5E78EB; }
  .ds-top h2 { font-weight: 700; font-size: 22px; color: #FFFFFF; letter-spacing: -.02em; margin-top: 4px; }
  .ds-top .gen { font-size: 10px; font-weight: 500; padding: 8px 12px; border-radius: 99px; background: #2B5FE0; color: #FFFFFF; }
  .ds-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
  .ds-grid .post { border-radius: 10px; }
  .ds-grid .post .q { font-size: 12px; }
  .ds-est { font-family: "Inter", sans-serif; font-size: 8px; font-weight: 600; padding: 3px 7px; border-radius: 99px; background: #0E1A33; color: #A9BEF7; border: 1px solid #2A3550; position: absolute; left: 8px; bottom: 8px; }
  .ds-camp { display: grid; grid-template-columns: 1.2fr 1fr 1fr; gap: 12px; }
  .ds-card { background: #0E1A33; border-radius: 12px; padding: 12px 14px; color: #94A3B8; border: 1px solid #2A3550; }
  .ds-card b { display: block; font-weight: 700; font-size: 19px; color: #FFFFFF; margin-top: 4px; letter-spacing: -.01em; }
  .ds-card .ok { color: #A9BEF7; font-weight: 600; }
  .ds-card .barra { height: 6px; border-radius: 99px; background: #1B2436; margin-top: 10px; overflow: hidden; }
  .ds-card .barra i { display: block; height: 100%; width: var(--p); background: #2B5FE0; }
  .ds-sem { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; flex: 1; }
  .ds-sem div { background: rgba(14,26,51,.85); border-radius: 10px; padding: 10px 8px; display: flex; flex-direction: column; gap: 6px; border: 1px solid #2A3550; }
  .ds-sem small { font-size: 9px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: #94A3B8; }
  .ds-sem span { font-size: 8.5px; line-height: 1.3; padding: 6px 7px; border-radius: 7px; background: #1B2436; color: #E6ECFE; }
  .ds-sem span.t { background: rgba(43,95,224,.4); }
  .ds-sem span.v { background: rgba(124,58,237,.35); color: #E6ECFE; }


  /* ---------- DelegaSales en el celular: campañas (tienda, plan DelegaSales) ---------- */
  .dsm { height: 100%; background: #0B1016; color: #94A3B8; font-family: "Inter", system-ui, sans-serif; padding: 56px 16px 16px; display: flex; flex-direction: column; gap: 12px; font-size: 11px;
    background-image: radial-gradient(circle, rgba(71,85,105,.35) 1.2px, transparent 1.4px); background-size: 28px 28px; }
  .dsm .ds-logo { margin-bottom: 4px; }
  .dsm h3 { font-size: 20px; font-weight: 700; color: #FFFFFF; letter-spacing: -.02em; line-height: 1.15; }
  .dsm .ds-card b { font-size: 22px; }
  .dsm-etapa { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; padding: 12px 14px; border-radius: 12px; background: #0E1A33; border: 1px solid #2A3550; }
  .dsm-etapa strong { color: #FFFFFF; font-size: 12px; font-weight: 600; }
  .dsm-etapa b { color: #FFFFFF; font-size: 16px; font-weight: 700; }
  .dsm-etapa .barra { grid-column: 1 / -1; height: 5px; border-radius: 99px; background: #1B2436; overflow: hidden; }
  .dsm-etapa .barra i { display: block; height: 100%; width: var(--p); background: var(--c, #2B5FE0); }
  .dsm .ia { padding: 12px 14px; border-radius: 12px; background: rgba(43,95,224,.16); border: 1px solid rgba(94,120,235,.45); color: #E6ECFE; line-height: 1.45; }
  .dsm .ia .ds-eti { display: block; margin-bottom: 4px; }

  /* ---------- Regalo + correo automático ---------- */
  .rg { padding: 54px 18px 18px; height: 100%; display: flex; flex-direction: column; gap: 14px; }
  .guia { border-radius: 18px; padding: 22px 20px; background: linear-gradient(160deg, var(--terra), #8E4326); color: #fff; position: relative; overflow: hidden; }
  .guia small { font-size: 9px; letter-spacing: .24em; text-transform: uppercase; opacity: .8; }
  .guia h3 { font-family: var(--display); font-weight: 600; font-size: 24px; line-height: 1.08; margin: 10px 0 8px; }
  .guia p { font-size: 11px; opacity: .85; }
  .guia::after { content: ""; position: absolute; right: -30px; bottom: -30px; width: 120px; height: 120px; border-radius: 50%; border: 10px solid rgba(255,255,255,.18); }
  .campo { padding: 12px 14px; border-radius: 12px; background: var(--noche-2); font-size: 11px; color: var(--gris-2); border: 1px solid rgba(255,255,255,.06); }
  .correo { margin-top: 4px; border-radius: 14px; background: var(--crema); color: var(--noche); padding: 14px; font-size: 10.5px; line-height: 1.45; }
  .correo .de { display: flex; justify-content: space-between; font-size: 9px; color: var(--gris-2); margin-bottom: 6px; }
  .correo b { display: block; font-size: 12px; margin-bottom: 4px; }
  .correo .auto { display: inline-block; font-size: 8px; letter-spacing: .14em; text-transform: uppercase; color: var(--terra); font-weight: 600; margin-bottom: 6px; }

  /* ---------- Campañas por etapas ---------- */
  .cp-h { font-family: var(--display); font-weight: 600; font-size: 28px; line-height: 1.08; color: var(--blanco); }
  .cp-h em { font-style: normal; color: var(--terra-2); }
  .etapas { display: flex; flex-direction: column; gap: 12px; }
  .etapa { display: grid; grid-template-columns: 44px 1fr auto; gap: 14px; align-items: center; padding: 14px 16px; border-radius: 14px; background: var(--noche-2); border: 1px solid rgba(255,255,255,.06); }
  .etapa em { font-style: normal; width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; font-family: var(--display); font-weight: 600; font-size: 18px; background: var(--c); color: var(--noche); }
  .etapa div { font-size: 11px; color: var(--gris); }
  .etapa div strong { display: block; font-size: 14px; color: var(--blanco); font-weight: 600; margin-bottom: 2px; }
  .etapa b { font-family: var(--display); font-weight: 600; font-size: 22px; color: var(--blanco); text-align: right; }
  .etapa b small { display: block; font-family: var(--sans); font-size: 9px; font-weight: 400; color: var(--gris); }
  .redes { display: flex; gap: 8px; font-size: 10px; color: var(--gris); }
  .redes span { padding: 6px 10px; border-radius: 99px; border: 1px solid rgba(255,255,255,.1); }

  /* ---------- Evento en vivo ---------- */
  .ev { padding: 54px 18px 18px; height: 100%; display: flex; flex-direction: column; gap: 14px; }
  .ev-cartel { border-radius: 20px; padding: 24px 20px; background: radial-gradient(80% 70% at 50% 0%, rgba(224,138,94,.45), transparent 70%), var(--noche-2); text-align: center; border: 1px solid rgba(200,105,63,.35); }
  .ev-cartel .vivo { display: inline-flex; align-items: center; gap: 6px; font-size: 9px; letter-spacing: .2em; text-transform: uppercase; color: #fff; background: #E0443B; padding: 5px 10px; border-radius: 99px; }
  .ev-cartel .vivo::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #fff; }
  .ev-cartel h3 { font-family: var(--display); font-weight: 600; font-size: 26px; line-height: 1.08; color: var(--blanco); margin: 14px 0 8px; }
  .ev-cartel p { font-size: 11px; color: var(--gris); }
  .ev-cartel .fecha { margin-top: 14px; font-size: 12px; color: var(--crema); }
  .ev-num { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .ev-num div { background: var(--noche-2); border-radius: 12px; padding: 12px; font-size: 10px; color: var(--gris); }
  .ev-num b { display: block; font-family: var(--display); font-weight: 600; font-size: 22px; color: var(--blanco); }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <!-- Isotipo: un grano de café que también es una semilla que brota -->
    <symbol id="iso" viewBox="0 0 64 64">
      <ellipse cx="32" cy="36" rx="17" ry="22" fill="currentColor" transform="rotate(18 32 36)"/>
      <path d="M26 18 C 38 28, 26 44, 38 56" fill="none" stroke="#16110E" stroke-width="3.2" stroke-linecap="round"/>
      <path d="M40 10 C 46 4, 54 6, 56 12 C 50 14, 44 14, 40 10 Z" fill="#6FCF8E"/>
    </symbol>
    <!-- Logo de Delega Sales: esfera azul con halo morado (guía de marca, nov 2026) -->
    <radialGradient id="dsCore" cx="50%" cy="50%" r="62%"><stop offset="0%" stop-color="#E6ECFE"/><stop offset="40%" stop-color="#A9BEF7"/><stop offset="100%" stop-color="#5E78EB"/></radialGradient>
    <radialGradient id="dsBloomFill" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#9163E8" stop-opacity="0.95"/><stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/></radialGradient>
    <filter id="dsBlur" x="-100%" y="-100%" width="300%" height="300%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="6.5"/></filter>
    <symbol id="ds-nucleo" viewBox="0 0 120 120">
      <circle cx="60" cy="60" r="46" fill="url(#dsBloomFill)" opacity="0.6" filter="url(#dsBlur)"/>
      <circle cx="60" cy="60" r="34" fill="url(#dsBloomFill)" opacity="0.8" filter="url(#dsBlur)"/>
      <circle cx="60" cy="60" r="25" fill="url(#dsCore)"/>
    </symbol>
  </defs>
</svg>

<template id="t-reporte">
  <div class="rp-cab"><span class="logo"><svg><use href="#iso"/></svg><b>raíz</b></span><span>Reporte · Noviembre</span></div>
  <div class="rp-h">Este mes vendiste <em>$3.480</em><br>por encima de tu base.</div>
