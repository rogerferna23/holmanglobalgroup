<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,300;1,9..144,400&family=DM+Sans:wght@300;400;500;600&display=block" rel="stylesheet">
<style>
  :root {
    --oliva: #3E4A2C;
    --oliva-2: #55623D;
    --salvia: #A9B48E;
    --crema: #F4EFE4;
    --arena: #E6DCC8;
    --terracota: #C2714A;
    --carbon: #23251F;
    --serif: "Fraunces", Georgia, serif;
    --sans: "DM Sans", Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: transparent; width: 100%; height: 100%; overflow: hidden; }
  body { font-family: var(--sans); color: var(--carbon); position: relative; }
  .escena { display: none; position: absolute; inset: 0; }
  body[data-e="hero"] #hero,
  body[data-e="starter"] #starter,
  body[data-e="pro"] #pro,
  body[data-e="elite"] #elite { display: block; }

  /* ---------- Piezas de marca ---------- */
  .logo { display: flex; align-items: center; gap: .45em; color: var(--oliva); }
  .logo svg { width: 1.25em; height: 1.25em; }
  .logo b { font-family: var(--serif); font-weight: 400; font-size: 1em; letter-spacing: -.01em; }
  .logo-v { flex-direction: column; gap: .2em; text-align: center; }
  .logo-v svg { width: 2.2em; height: 2.2em; }
  .logo-v small { font-size: .17em; letter-spacing: .42em; font-weight: 500; text-transform: uppercase; color: var(--oliva-2); }
  .kick { font-size: 9px; letter-spacing: .28em; text-transform: uppercase; font-weight: 500; color: var(--terracota); }

  /* ---------- Dispositivos ---------- */
  .laptop { position: absolute; }
  .laptop .tapa { background: #121314; border-radius: 22px 22px 0 0; padding: 18px 18px 22px; box-shadow: inset 0 0 0 2px #2b2d30; }
  .laptop .pantalla { background: var(--crema); border-radius: 4px; overflow: hidden; position: relative; aspect-ratio: 16/10; }
  .laptop .base { height: 22px; margin: 0 -6%; background: linear-gradient(180deg, #d9dade, #a9abb1 70%, #8d8f95); border-radius: 0 0 26px 26px; position: relative; }
  .laptop .base::before { content: ""; position: absolute; left: 50%; top: 0; width: 16%; height: 8px; transform: translateX(-50%); background: #b9bbc0; border-radius: 0 0 10px 10px; }
  .phone { position: absolute; background: #121314; border-radius: 54px; padding: 13px; box-shadow: inset 0 0 0 2px #34363a; }
  .phone .pantalla { background: var(--crema); border-radius: 42px; overflow: hidden; height: 100%; position: relative; }
  .phone .isla { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); width: 30%; height: 26px; background: #050505; border-radius: 20px; z-index: 5; }
  .sombra { filter: drop-shadow(0 40px 50px rgba(0,0,0,.35)) drop-shadow(0 8px 14px rgba(0,0,0,.22)); }

  /* ---------- Sitio web ---------- */
  .web { position: absolute; inset: 0; display: flex; flex-direction: column; }
  .web-nav { display: flex; align-items: center; justify-content: space-between; padding: 22px 40px; font-size: 13px; }
  .web-nav .logo { font-size: 22px; }
  .web-nav ul { display: flex; gap: 26px; list-style: none; color: var(--oliva-2); }
  .web-nav .btn-s { padding: 9px 16px; border-radius: 99px; background: var(--oliva); color: var(--crema); font-size: 12px; }
  .web-hero { flex: 1; display: grid; grid-template-columns: 1.05fr 1fr; align-items: center; padding: 0 40px 0 56px; gap: 30px; }
  .web-hero h1 { font-family: var(--serif); font-weight: 300; font-size: 52px; line-height: 1.02; color: var(--oliva); letter-spacing: -.02em; margin: 14px 0 16px; }
  .web-hero h1 em { color: var(--terracota); font-style: italic; }
  .web-hero p { font-size: 14px; line-height: 1.55; color: #5b5d52; max-width: 34ch; }
  .web-btns { display: flex; gap: 12px; margin-top: 24px; align-items: center; }
  .btn { padding: 13px 22px; border-radius: 99px; background: var(--terracota); color: #fff; font-size: 13px; font-weight: 500; }
  .btn-l { font-size: 13px; color: var(--oliva); border-bottom: 1px solid var(--salvia); padding-bottom: 2px; }
  .arco { position: relative; height: 92%; align-self: end; border-radius: 999px 999px 0 0; background: linear-gradient(170deg, var(--salvia), var(--oliva-2)); overflow: hidden; }
  .arco .rama { position: absolute; width: 120%; left: -6%; top: 14%; color: var(--crema); opacity: .95; }
  .arco .sol { position: absolute; width: 38%; aspect-ratio: 1; border-radius: 50%; background: var(--arena); opacity: .55; top: 12%; right: 12%; }
  .web-sello { position: absolute; left: 50%; bottom: 40px; transform: translateX(-30%); background: var(--crema); border-radius: 14px; padding: 12px 16px; display: flex; gap: 10px; align-items: center; font-size: 11px; box-shadow: 0 10px 30px rgba(0,0,0,.12); }
  .web-sello strong { font-family: var(--serif); font-size: 22px; font-weight: 400; color: var(--oliva); }
  .web-wa { position: absolute; right: 22px; bottom: 22px; width: 44px; height: 44px; border-radius: 50%; background: #25D366; display: grid; place-items: center; }

  /* Sitio en el celular */
  .webm { padding: 54px 22px 20px; display: flex; flex-direction: column; height: 100%; }
  .webm .logo { font-size: 20px; }
  .webm h1 { font-family: var(--serif); font-weight: 300; font-size: 34px; line-height: 1.03; color: var(--oliva); margin: 22px 0 12px; letter-spacing: -.02em; }
  .webm h1 em { color: var(--terracota); }
  .webm p { font-size: 12px; line-height: 1.5; color: #5b5d52; }
  .webm .btn { display: block; text-align: center; margin-top: 18px; }
  .webm .arco { height: auto; flex: 1; align-self: stretch; margin-top: 24px; border-radius: 200px 200px 18px 18px; }

  /* ---------- Instagram ---------- */
  .ig { padding: 50px 14px 0; font-size: 11px; }
  .ig-top { display: flex; justify-content: space-between; align-items: center; font-weight: 600; font-size: 14px; padding: 0 4px 12px; }
  .ig-perfil { display: flex; align-items: center; gap: 16px; padding: 0 4px; }
  .ig-avatar { width: 74px; height: 74px; border-radius: 50%; background: var(--crema); display: grid; place-items: center; box-shadow: 0 0 0 2px var(--terracota), 0 0 0 5px #fff; flex: none; }
  .ig-avatar svg { width: 40px; color: var(--oliva); }
  .ig-nums { display: flex; gap: 18px; text-align: center; }
  .ig-nums b { display: block; font-size: 15px; }
  .ig-bio { padding: 12px 4px; line-height: 1.45; }
  .ig-bio b { font-size: 12px; }
  .ig-bio span { color: #00376b; }
  .ig-dest { display: flex; gap: 12px; padding: 4px 4px 14px; }
  .ig-dest i { width: 52px; height: 52px; border-radius: 50%; border: 1px solid #ddd; display: grid; place-items: center; font-style: normal; font-size: 9px; color: var(--oliva); background: var(--crema); }
  .ig-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; margin: 0 -14px; }
  .post { aspect-ratio: 4/5; position: relative; overflow: hidden; display: flex; flex-direction: column; justify-content: center; padding: 10px; font-family: var(--serif); line-height: 1.05; }
  .post.c { background: var(--crema); color: var(--oliva); }
  .post.o { background: var(--oliva); color: var(--crema); }
  .post.t { background: var(--terracota); color: #fff; }
  .post.s { background: var(--salvia); color: var(--oliva); }
  .post.a { background: var(--arena); color: var(--oliva); }
  .post small { font-family: var(--sans); font-size: 6px; letter-spacing: .2em; text-transform: uppercase; opacity: .8; margin-bottom: 6px; }
  .post .q { font-size: 15px; font-weight: 300; }
  .post .n { font-size: 34px; font-weight: 300; }
  .post svg { position: absolute; width: 130%; right: -40%; bottom: -10%; opacity: .35; }
  .post .bol { position: absolute; width: 70%; aspect-ratio: 1; border-radius: 50%; border: 6px solid currentColor; right: -14%; bottom: -14%; opacity: .25; }

  /* ---------- Tablero de marca (papel) ---------- */
  .papel { position: absolute; background: #FBF8F1; border-radius: 6px; box-shadow: 0 1px 0 rgba(0,0,0,.04); padding: 46px 50px; overflow: hidden; }
  .papel .cab { display: flex; justify-content: space-between; align-items: baseline; font-size: 10px; letter-spacing: .26em; text-transform: uppercase; color: var(--oliva-2); border-bottom: 1px solid #e3dccb; padding-bottom: 14px; }
  .bb { display: grid; grid-template-columns: 1.1fr 1fr; gap: 34px; margin-top: 30px; }
  .bb-logo { background: var(--crema); border-radius: 4px; display: grid; place-items: center; font-size: 60px; aspect-ratio: 1; }
  .bb-logo .logo-v b { font-size: 1em; }
  .bb-paleta { display: grid; grid-template-rows: 2fr 1fr 1fr 1fr; gap: 8px; }
  .sw { border-radius: 4px; padding: 10px 12px; font-size: 9px; letter-spacing: .12em; display: flex; flex-direction: column; justify-content: flex-end; }
  .sw b { font-family: var(--serif); font-weight: 400; font-size: 13px; letter-spacing: 0; margin-bottom: 2px; }
  .bb-tipo { display: grid; grid-template-columns: 1fr 1fr; gap: 34px; margin-top: 30px; padding-top: 24px; border-top: 1px solid #e3dccb; }
  .aa { font-family: var(--serif); font-weight: 300; font-size: 76px; line-height: .9; color: var(--oliva); }
  .aa.sans { font-family: var(--sans); font-weight: 400; color: var(--carbon); font-size: 66px; }
  .tipo-n { font-size: 10px; letter-spacing: .22em; text-transform: uppercase; color: var(--oliva-2); margin-top: 10px; }
  .tipo-m { font-size: 11px; color: #777; margin-top: 4px; }

  /* Tarjetas de presentación */
  .tarjeta { position: absolute; width: 340px; height: 200px; border-radius: 6px; padding: 26px 28px; }
  .tarjeta.f { background: var(--oliva); color: var(--crema); display: grid; place-items: center; }
  .tarjeta.f .logo { color: var(--crema); font-size: 40px; }
  .tarjeta.f .logo-v small { color: var(--salvia); }
  .tarjeta.d { background: #FBF8F1; display: flex; flex-direction: column; justify-content: space-between; }
  .tarjeta.d h4 { font-family: var(--serif); font-weight: 400; font-size: 22px; color: var(--oliva); }
  .tarjeta.d p { font-size: 10px; color: #666; line-height: 1.6; }
  .tarjeta.d .logo { font-size: 18px; }

  /* Hoja de manual */
  .manual { position: absolute; background: var(--oliva); border-radius: 6px; padding: 40px; color: var(--crema); display: flex; flex-direction: column; justify-content: space-between; }
  .manual .logo { color: var(--crema); font-size: 26px; }
  .manual h3 { font-family: var(--serif); font-weight: 300; font-size: 40px; line-height: 1.02; }
  .manual h3 em { color: var(--salvia); }
  .manual p { font-size: 10px; letter-spacing: .26em; text-transform: uppercase; color: var(--salvia); }

  /* ---------- Embudo / plan de contenido (tablet) ---------- */
  .tablet { position: absolute; background: #121314; border-radius: 34px; padding: 16px; box-shadow: inset 0 0 0 2px #34363a; }
  .tablet .pantalla { background: #FBF8F1; border-radius: 20px; height: 100%; overflow: hidden; padding: 30px 32px; display: flex; flex-direction: column; gap: 18px; }
  .pl-cab { display: flex; justify-content: space-between; align-items: center; }
  .pl-cab .logo { font-size: 20px; }
  .pl-cab > span:last-child { font-size: 10px; letter-spacing: .2em; text-transform: uppercase; color: var(--oliva-2); }
  .pl-h { font-family: var(--serif); font-weight: 300; font-size: 30px; color: var(--oliva); line-height: 1.05; }
  .pl-h em { color: var(--terracota); }
  .embudo { display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .embudo div { height: 44px; border-radius: 8px; display: flex; align-items: center; justify-content: space-between; padding: 0 18px; font-size: 12px; }
  .embudo b { font-family: var(--serif); font-weight: 400; font-size: 20px; }
  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .cal i { height: 50px; border-radius: 6px; background: #eee7d8; font-style: normal; font-size: 8px; color: #8a8a7c; padding: 5px; position: relative; }
  .cal i.p { background: var(--salvia); color: var(--oliva); }
  .cal i.r { background: var(--terracota); color: #fff; }
  .cal i.o { background: var(--oliva); color: var(--crema); }
  .ley { display: flex; gap: 16px; font-size: 10px; color: #666; }
  .ley span::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; background: var(--c); }

  /* Mensaje de seguimiento */
  .wa { padding: 50px 0 0; height: 100%; display: flex; flex-direction: column; background: #EFE7DA; }
  .wa-top { background: var(--oliva); color: var(--crema); padding: 14px 16px; display: flex; gap: 10px; align-items: center; font-size: 13px; margin-top: -50px; padding-top: 58px; }
  .wa-top i { width: 32px; height: 32px; border-radius: 50%; background: var(--crema); display: grid; place-items: center; }
  .wa-top i svg { width: 20px; color: var(--oliva); }
  .wa-top small { display: block; font-size: 9px; opacity: .75; }
  .wa-body { padding: 16px 12px; display: flex; flex-direction: column; gap: 10px; font-size: 11.5px; line-height: 1.4; }
  .msg { max-width: 82%; padding: 9px 11px; border-radius: 12px; background: #fff; box-shadow: 0 1px 0 rgba(0,0,0,.06); }
  .msg.yo { align-self: flex-end; background: #DCF3C8; }
  .msg small { display: block; text-align: right; font-size: 8px; color: #999; margin-top: 3px; }
  .msg .auto { font-size: 8px; letter-spacing: .14em; text-transform: uppercase; color: var(--terracota); display: block; margin-bottom: 4px; }
  .msg .bt { display: block; margin-top: 8px; padding: 7px; text-align: center; border-radius: 8px; background: var(--crema); color: var(--oliva); font-weight: 500; }
</style>
</head>

<template id="t-wa">
  <div class="wa">
    <div class="wa-top"><i><svg viewBox="0 0 64 64"><use href="#iso"/></svg></i><div>Olivo · Nutrición<small>en línea</small></div></div>
    <div class="wa-body">
      <div class="msg yo">Hola, vi su anuncio. ¿Cómo funcionan los planes?<small>9:41</small></div>
      <div class="msg"><span class="auto">Respuesta automática</span>¡Hola! Qué bueno tenerte aquí 🌿 Te envío la guía gratis «Tu plato en 4 partes» y los planes.<small>9:41</small></div>
      <div class="msg"><span class="auto">Seguimiento · 2 días</span>¿Pudiste ver la guía? Si quieres, agendamos tu primera consulta esta semana.<span class="bt">Agendar consulta</span><small>10:02</small></div>
      <div class="msg yo">¡Sí! El jueves me sirve 🙌<small>10:15</small></div>
    </div>
  </div>
</template>

<template id="t-plan">
  <div class="pl-cab"><span class="logo"><svg><use href="#iso"/></svg><b>olivo</b></span><span>Estrategia · 90 días</span></div>
  <div class="pl-h">De seguidora a <em>clienta</em>,<br>paso a paso.</div>
  <div class="embudo">
    <div style="width:100%;background:var(--arena);color:var(--oliva)"><span>Ven el contenido</span><b>4.800</b></div>
    <div style="width:80%;background:var(--salvia);color:var(--oliva)"><span>Descargan la guía</span><b>620</b></div>
    <div style="width:60%;background:var(--oliva-2);color:var(--crema)"><span>Agendan consulta</span><b>94</b></div>
    <div style="width:42%;background:var(--terracota);color:#fff"><span>Clientas</span><b>38</b></div>
  </div>
  <div class="pl-cab" style="margin-top:4px"><span>Plan de contenido · Mes 1</span><span>Semana 1–5</span></div>
  <div class="cal" id="cal"></div>
  <div class="ley"><span style="--c:var(--salvia)">Educa</span><span style="--c:var(--terracota)">Vende</span><span style="--c:var(--oliva)">Conecta</span></div>
</template>

<!-- ======================= Escenas ======================= -->

<!-- Hero 2200 × 1500: todo el paquete -->
<section class="escena" id="hero">
  <div class="papel sombra" style="left:90px;top:170px;width:760px;height:900px;transform:rotate(-5deg)" data-t="t-board"></div>
  <div class="laptop sombra" style="left:560px;top:120px;width:1240px" >
    <div class="tapa"><div class="pantalla" data-t="t-web"></div></div><div class="base"></div>
  </div>
  <div class="phone sombra" style="left:1700px;top:560px;width:400px;height:840px;transform:rotate(4deg)"><span class="isla"></span><div class="pantalla" data-t="t-ig"></div></div>
  <div class="sombra" style="position:absolute;left:300px;top:1060px;transform:rotate(-9deg)" >
    <div style="position:relative;width:640px;height:330px" data-t="t-tarjetas" data-pos="hero"></div>
  </div>
</section>

<!-- Starter 1600 × 1100: identidad -->
<section class="escena" id="starter">
  <div class="manual sombra" style="left:1020px;top:110px;width:500px;height:640px;transform:rotate(6deg)">
    <span class="logo"><svg><use href="#iso"/></svg><b>olivo</b></span>
    <h3>Manual<br>de <em>marca</em></h3>
    <p>Versión 1.0 · Guía de uso</p>
  </div>
  <div class="papel sombra" style="left:140px;top:70px;width:820px;height:960px;transform:rotate(-3deg)" data-t="t-board"></div>
  <div class="sombra" style="position:absolute;left:880px;top:700px;transform:rotate(-7deg)">
    <div style="position:relative;width:640px;height:330px" data-t="t-tarjetas" data-pos="hero"></div>
  </div>
</section>

<!-- Pro 1600 × 1100: web en computador y celular -->
<section class="escena" id="pro">
  <div class="laptop sombra" style="left:60px;top:120px;width:1220px">
    <div class="tapa"><div class="pantalla" data-t="t-web"></div></div><div class="base"></div>
  </div>
  <div class="phone sombra" style="left:1140px;top:300px;width:380px;height:780px"><span class="isla"></span><div class="pantalla" data-t="t-webm"></div></div>
</section>

<!-- Elite 1600 × 1100: estrategia, contenido y seguimiento -->
<section class="escena" id="elite">
  <div class="tablet sombra" style="left:60px;top:80px;width:720px;height:960px;transform:rotate(-3deg)"><div class="pantalla" data-t="t-plan"></div></div>
  <div class="phone sombra" style="left:800px;top:150px;width:380px;height:800px;transform:rotate(-2deg)"><span class="isla"></span><div class="pantalla" data-t="t-ig"></div></div>
  <div class="phone sombra" style="left:1170px;top:250px;width:370px;height:780px;transform:rotate(4deg)"><span class="isla"></span><div class="pantalla" data-t="t-wa"></div></div>
</section>

<script>
  document.body.dataset.e = (location.hash || "#hero").slice(1);
  document.querySelectorAll("[data-t]").forEach((el) => {
    el.appendChild(document.getElementById(el.dataset.t).content.cloneNode(true));
  });
  // Tarjetas: una sobre otra
  document.querySelectorAll('[data-pos="hero"]').forEach((el) => {
    const [f, d] = el.querySelectorAll(".tarjeta");
    Object.assign(f.style, { left: "0", top: "0", boxShadow: "0 20px 40px rgba(0,0,0,.25)" });
    Object.assign(d.style, { left: "250px", top: "110px", boxShadow: "0 20px 40px rgba(0,0,0,.25)" });
  });
  // Calendario de contenido (35 días)
  const tipos = "p.r.o..p.o.r..p.p.o.r..p.r.o..p.o.r.";
  document.querySelectorAll("#cal").forEach((cal) => {
    for (let i = 0; i < 35; i++) {
      const t = tipos[i] === "." ? "" : tipos[i];
      const el = document.createElement("i");
      if (t) el.className = t;
      el.textContent = i + 1;
      cal.appendChild(el);
    }
  });
</script>
</body>
</html>
