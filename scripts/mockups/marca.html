<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<!-- Mockups de Marca con Huella para la vitrina de /tienda. «Órbita» es una
     marca de muestra (no existe). Se fotografía con render.sh marca. -->
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600&family=Inter:wght@300;400;500;600&display=block" rel="stylesheet">
<style>
  :root {
    --azul: #2D5BFF;
    --azul-2: #5B7FFF;
    --noche: #0A1330;
    --noche-2: #142045;
    --hielo: #E8EEFF;
    --blanco: #FFFFFF;
    --cian: #6FD3FF;
    --tinta: #131A2E;
    --gris: #6B7390;
    --display: "Sora", Helvetica, Arial, sans-serif;
    --sans: "Inter", Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: transparent; width: 100%; height: 100%; overflow: hidden; }
  body { font-family: var(--sans); color: var(--tinta); position: relative; }
  .escena { display: none; position: absolute; inset: 0; }
  body[data-e="hero"] #hero, body[data-e="starter"] #starter,
  body[data-e="pro"] #pro, body[data-e="elite"] #elite { display: block; }
  .sombra { filter: drop-shadow(0 40px 50px rgba(0,0,0,.35)) drop-shadow(0 8px 14px rgba(0,0,0,.22)); }

  /* ---------- Marca ---------- */
  .logo { display: flex; align-items: center; gap: .4em; color: var(--noche); }
  .logo svg { width: 1.2em; height: 1.2em; color: var(--azul); }
  .logo b { font-family: var(--display); font-weight: 600; font-size: 1em; letter-spacing: -.03em; }
  .logo-v { flex-direction: column; gap: .25em; text-align: center; }
  .logo-v svg { width: 2em; height: 2em; }
  .logo-v small { font-size: .16em; letter-spacing: .44em; font-weight: 500; text-transform: uppercase; color: var(--gris); }
  .claro .logo, .logo.claro { color: var(--blanco); }
  .claro .logo-v small { color: #9FB2FF; }
  .kick { font-size: 9px; letter-spacing: .26em; text-transform: uppercase; font-weight: 600; color: var(--azul); }

  /* ---------- Dispositivos ---------- */
  .laptop { position: absolute; }
  .laptop .tapa { background: #121314; border-radius: 22px 22px 0 0; padding: 18px 18px 22px; box-shadow: inset 0 0 0 2px #2b2d30; }
  .laptop .pantalla { background: var(--blanco); border-radius: 4px; overflow: hidden; position: relative; aspect-ratio: 16/10; }
  .laptop .base { height: 22px; margin: 0 -6%; background: linear-gradient(180deg, #d9dade, #a9abb1 70%, #8d8f95); border-radius: 0 0 26px 26px; position: relative; }
  .laptop .base::before { content: ""; position: absolute; left: 50%; top: 0; width: 16%; height: 8px; transform: translateX(-50%); background: #b9bbc0; border-radius: 0 0 10px 10px; }
  .phone { position: absolute; background: #121314; border-radius: 54px; padding: 13px; box-shadow: inset 0 0 0 2px #34363a; }
  .phone .pantalla { background: var(--blanco); border-radius: 42px; overflow: hidden; height: 100%; position: relative; }
  .phone .isla { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); width: 30%; height: 26px; background: #050505; border-radius: 20px; z-index: 5; }
  .tablet { position: absolute; background: #121314; border-radius: 34px; padding: 16px; box-shadow: inset 0 0 0 2px #34363a; }
  .tablet .pantalla { background: var(--blanco); border-radius: 20px; height: 100%; overflow: hidden; padding: 30px 32px; display: flex; flex-direction: column; gap: 18px; }

  /* ---------- Gráfico de órbitas ---------- */
  .orbitas { position: relative; overflow: hidden; background: radial-gradient(120% 90% at 30% 20%, var(--azul-2), var(--azul) 45%, var(--noche) 100%); }
  .orbitas svg { position: absolute; inset: 0; width: 100%; height: 100%; }

  /* ---------- Sitio web ---------- */
  .web { position: absolute; inset: 0; display: flex; flex-direction: column; }
  .web-nav { display: flex; align-items: center; justify-content: space-between; padding: 22px 40px; font-size: 13px; }
  .web-nav .logo { font-size: 22px; }
  .web-nav ul { display: flex; gap: 26px; list-style: none; color: var(--gris); }
  .web-nav .btn-s { padding: 9px 16px; border-radius: 10px; background: var(--noche); color: var(--blanco); font-size: 12px; }
  .web-hero { flex: 1; display: grid; grid-template-columns: 1.05fr 1fr; align-items: center; padding: 0 40px 30px 56px; gap: 36px; }
  .chip { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 99px; background: var(--hielo); color: var(--azul); font-size: 11px; font-weight: 500; }
  .chip i { width: 6px; height: 6px; border-radius: 50%; background: var(--azul); }
  .web-hero h1 { font-family: var(--display); font-weight: 600; font-size: 46px; line-height: 1.04; color: var(--noche); letter-spacing: -.035em; margin: 16px 0 14px; }
  .web-hero h1 em { font-style: normal; color: var(--azul); }
  .web-hero p { font-size: 14px; line-height: 1.55; color: var(--gris); max-width: 36ch; }
  .web-btns { display: flex; gap: 14px; margin-top: 24px; align-items: center; }
  .btn { padding: 13px 22px; border-radius: 12px; background: var(--azul); color: #fff; font-size: 13px; font-weight: 500; box-shadow: 0 10px 24px rgba(45,91,255,.35); }
  .btn-l { font-size: 13px; color: var(--noche); font-weight: 500; }
  .alumnos { display: flex; align-items: center; gap: 10px; margin-top: 26px; font-size: 12px; color: var(--gris); }
  .caras { display: flex; }
  .caras i { width: 26px; height: 26px; border-radius: 50%; border: 2px solid #fff; margin-left: -8px; background: var(--c); }
  .caras i:first-child { margin-left: 0; }
  .panel { position: relative; height: 86%; border-radius: 22px; }
  .panel-card { position: absolute; background: #fff; border-radius: 14px; padding: 12px 14px; box-shadow: 0 16px 34px rgba(10,19,48,.25); font-size: 11px; color: var(--tinta); }
  .panel-card b { display: block; font-family: var(--display); font-size: 20px; font-weight: 600; color: var(--noche); }
  .panel-card .sube { color: #14A06A; font-weight: 600; font-size: 10px; }
  .play { position: absolute; left: 50%; top: 46%; width: 70px; height: 70px; transform: translate(-50%, -50%); border-radius: 50%; background: rgba(255,255,255,.18); backdrop-filter: blur(4px); display: grid; place-items: center; border: 1px solid rgba(255,255,255,.4); }
  .play::after { content: ""; margin-left: 5px; border-left: 18px solid #fff; border-top: 11px solid transparent; border-bottom: 11px solid transparent; }

  /* Sitio en el celular */
  .webm { padding: 54px 22px 20px; display: flex; flex-direction: column; height: 100%; }
  .webm .logo { font-size: 20px; }
  .webm .chip { margin-top: 22px; align-self: flex-start; }
  .webm h1 { font-family: var(--display); font-weight: 600; font-size: 30px; line-height: 1.05; color: var(--noche); margin: 12px 0 10px; letter-spacing: -.035em; }
  .webm h1 em { font-style: normal; color: var(--azul); }
  .webm p { font-size: 12px; line-height: 1.5; color: var(--gris); }
  .webm .btn { display: block; text-align: center; margin-top: 18px; }
  .webm .orbitas { flex: 1; margin-top: 20px; border-radius: 22px; }

  /* ---------- Instagram ---------- */
  .ig { padding: 50px 14px 0; font-size: 11px; }
  .ig-top { display: flex; justify-content: space-between; align-items: center; font-weight: 600; font-size: 14px; padding: 0 4px 12px; }
  .ig-perfil { display: flex; align-items: center; gap: 16px; padding: 0 4px; }
  .ig-avatar { width: 74px; height: 74px; border-radius: 50%; background: var(--noche); display: grid; place-items: center; box-shadow: 0 0 0 2px var(--azul), 0 0 0 5px #fff; flex: none; }
  .ig-avatar svg { width: 40px; color: var(--azul); }
  .ig-nums { display: flex; gap: 18px; text-align: center; }
  .ig-nums b { display: block; font-size: 15px; }
  .ig-bio { padding: 12px 4px; line-height: 1.45; }
  .ig-bio b { font-size: 12px; }
  .ig-bio span { color: #00376b; }
  .ig-dest { display: flex; gap: 12px; padding: 4px 4px 14px; }
  .ig-dest i { width: 52px; height: 52px; border-radius: 50%; border: 1px solid #ddd; display: grid; place-items: center; font-style: normal; font-size: 9px; color: var(--noche); background: var(--hielo); }
  .ig-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; margin: 0 -14px; }
  .post { aspect-ratio: 4/5; position: relative; overflow: hidden; display: flex; flex-direction: column; justify-content: center; padding: 10px; font-family: var(--display); line-height: 1.08; letter-spacing: -.02em; }
  .post.b { background: var(--blanco); color: var(--noche); }
  .post.n { background: var(--noche); color: var(--blanco); }
  .post.a { background: var(--azul); color: var(--blanco); }
  .post.h { background: var(--hielo); color: var(--noche); }
  .post small { font-family: var(--sans); font-size: 6px; letter-spacing: .2em; text-transform: uppercase; opacity: .75; margin-bottom: 6px; }
  .post .q { font-size: 14px; font-weight: 600; }
  .post .q em { font-style: normal; color: var(--cian); }
  .post.b .q em, .post.h .q em { color: var(--azul); }
  .post .num { font-size: 32px; font-weight: 600; }
  .post .aro { position: absolute; width: 80%; aspect-ratio: 1; border-radius: 50%; border: 2px solid currentColor; right: -30%; bottom: -30%; opacity: .3; }
  .post .aro::after { content: ""; position: absolute; width: 10px; height: 10px; border-radius: 50%; background: var(--cian); top: 10%; left: 18%; }

  /* ---------- Tablero de marca ---------- */
  .papel { position: absolute; background: var(--blanco); border-radius: 6px; padding: 46px 50px; overflow: hidden; }
  .papel .cab { display: flex; justify-content: space-between; align-items: baseline; font-size: 10px; letter-spacing: .26em; text-transform: uppercase; color: var(--gris); border-bottom: 1px solid #e3e7f2; padding-bottom: 14px; }
  .bb { display: grid; grid-template-columns: 1.1fr 1fr; gap: 34px; margin-top: 30px; }
  .bb-logo { background: var(--hielo); border-radius: 6px; display: grid; place-items: center; font-size: 58px; aspect-ratio: 1; }
  .bb-paleta { display: grid; grid-template-rows: 2fr 1fr 1fr 1fr; gap: 8px; }
  .sw { border-radius: 6px; padding: 10px 12px; font-size: 9px; letter-spacing: .12em; display: flex; flex-direction: column; justify-content: flex-end; }
  .sw b { font-family: var(--display); font-weight: 500; font-size: 13px; letter-spacing: 0; margin-bottom: 2px; }
  .bb-tipo { display: grid; grid-template-columns: 1fr 1fr; gap: 34px; margin-top: 30px; padding-top: 24px; border-top: 1px solid #e3e7f2; }
  .aa { font-family: var(--display); font-weight: 600; font-size: 74px; line-height: .9; color: var(--noche); letter-spacing: -.04em; }
  .aa.sans { font-family: var(--sans); font-weight: 400; font-size: 66px; color: var(--azul); letter-spacing: -.02em; }
  .tipo-n { font-size: 10px; letter-spacing: .22em; text-transform: uppercase; color: var(--gris); margin-top: 10px; }
  .tipo-m { font-size: 11px; color: #8a90a6; margin-top: 4px; }

  .tarjeta { position: absolute; width: 340px; height: 200px; border-radius: 8px; padding: 26px 28px; }
  .tarjeta.f { background: var(--noche); display: grid; place-items: center; }
  .tarjeta.f .logo { color: var(--blanco); font-size: 40px; }
  .tarjeta.f .logo-v small { color: #9FB2FF; }
  .tarjeta.d { background: var(--blanco); display: flex; flex-direction: column; justify-content: space-between; border-top: 6px solid var(--azul); }
  .tarjeta.d h4 { font-family: var(--display); font-weight: 600; font-size: 21px; color: var(--noche); letter-spacing: -.02em; }
  .tarjeta.d p { font-size: 10px; color: var(--gris); line-height: 1.6; }
  .tarjeta.d .logo { font-size: 18px; }

  .manual { position: absolute; border-radius: 6px; padding: 40px; color: var(--blanco); display: flex; flex-direction: column; justify-content: space-between; overflow: hidden; }
  .manual .logo { color: var(--blanco); font-size: 26px; position: relative; }
  .manual h3 { margin-bottom: auto; margin-top: 60px; font-family: var(--display); font-weight: 600; font-size: 40px; line-height: 1.02; letter-spacing: -.03em; position: relative; }
  .manual h3 em { font-style: normal; color: var(--cian); }
  .manual p { font-size: 10px; letter-spacing: .26em; text-transform: uppercase; color: #9FB2FF; position: relative; }

  /* ---------- Estrategia (tablet) ---------- */
  .pl-cab { display: flex; justify-content: space-between; align-items: center; }
  .pl-cab .logo { font-size: 20px; }
  .pl-cab > span:last-child { font-size: 10px; letter-spacing: .2em; text-transform: uppercase; color: var(--gris); }
  .pl-h { font-family: var(--display); font-weight: 600; font-size: 28px; color: var(--noche); line-height: 1.08; letter-spacing: -.03em; }
  .pl-h em { font-style: normal; color: var(--azul); }
  .embudo { display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .embudo div { height: 44px; border-radius: 10px; display: flex; align-items: center; justify-content: space-between; padding: 0 18px; font-size: 12px; }
  .embudo b { font-family: var(--display); font-weight: 600; font-size: 19px; }
  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .cal i { height: 50px; border-radius: 8px; background: #F1F4FB; font-style: normal; font-size: 8px; color: #9aa1b8; padding: 5px; }
  .cal i.p { background: var(--hielo); color: var(--azul); }
  .cal i.r { background: var(--azul); color: #fff; }
  .cal i.o { background: var(--noche); color: #fff; }
  .ley { display: flex; gap: 16px; font-size: 10px; color: var(--gris); }
  .ley span::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; background: var(--c); }

  /* ---------- Seguimiento por WhatsApp ---------- */
  .wa { padding: 50px 0 0; height: 100%; display: flex; flex-direction: column; background: #EEF1F8; }
  .wa-top { background: var(--noche); color: #fff; padding: 58px 16px 14px; display: flex; gap: 10px; align-items: center; font-size: 13px; margin-top: -50px; }
  .wa-top i { width: 32px; height: 32px; border-radius: 50%; background: var(--azul); display: grid; place-items: center; }
  .wa-top i svg { width: 20px; color: #fff; }
  .wa-top small { display: block; font-size: 9px; opacity: .75; }
  .wa-body { padding: 16px 12px; display: flex; flex-direction: column; gap: 10px; font-size: 11.5px; line-height: 1.4; }
  .msg { max-width: 82%; padding: 9px 11px; border-radius: 12px; background: #fff; box-shadow: 0 1px 0 rgba(0,0,0,.06); }
  .msg.yo { align-self: flex-end; background: #DCF3C8; }
  .msg small { display: block; text-align: right; font-size: 8px; color: #999; margin-top: 3px; }
  .msg .auto { font-size: 8px; letter-spacing: .14em; text-transform: uppercase; color: var(--azul); display: block; margin-bottom: 4px; font-weight: 600; }
  .msg .bt { display: block; margin-top: 8px; padding: 7px; text-align: center; border-radius: 8px; background: var(--hielo); color: var(--azul); font-weight: 600; }
</style>
</head>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <!-- Isotipo: un planeta con su órbita -->
    <symbol id="iso" viewBox="0 0 64 64">
      <circle cx="32" cy="32" r="13" fill="currentColor"/>

      <circle cx="55" cy="22" r="4.5" fill="#6FD3FF"/>
    </symbol>
    <!-- Órbitas para fondos -->
    <symbol id="orbs" viewBox="0 0 400 400" preserveAspectRatio="xMidYMid slice">
      <g fill="none" stroke="#fff" stroke-opacity=".28">
        <ellipse cx="200" cy="210" rx="190" ry="70" transform="rotate(-22 200 210)" stroke-width="1.5"/>

    </symbol>
  </defs>
</svg>

<template id="t-tarjetas">
