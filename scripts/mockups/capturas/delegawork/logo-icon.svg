<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Delega Work">
  <!-- anillos orbitales punteados -->
  <circle cx="50" cy="50" r="19" fill="none" stroke="#8B5CF6" stroke-opacity="0.45" stroke-width="1" stroke-dasharray="1.4 3.6" stroke-linecap="round"/>
  <circle cx="50" cy="50" r="33" fill="none" stroke="#8B5CF6" stroke-opacity="0.4" stroke-width="1" stroke-dasharray="1.4 3.6" stroke-linecap="round"/>
  <!-- conexiones (debajo de los nodos) -->
  <g stroke="#7C3AED" stroke-width="2.4" stroke-linecap="round">
    <line x1="50" y1="50" x2="50" y2="18"/>
    <line x1="50" y1="50" x2="77.7" y2="66"/>
    <line x1="50" y1="50" x2="22.3" y2="66"/>
  </g>
  <!-- nodos satélite -->
  <g fill="#8B5CF6">
    <circle cx="50" cy="18" r="6"/>
    <circle cx="77.7" cy="66" r="6"/>
    <circle cx="22.3" cy="66" r="6"/>
  </g>
  <!-- nodo central -->
  <circle cx="50" cy="50" r="8.5" fill="#7C3AED"/>
</svg>
