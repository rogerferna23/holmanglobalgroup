<!doctype html>
<!-- Foto de perfil de los canales de ECOS: la placa del panel (src/styles/ecos-panel.css)
     sola (sin texto, centrada). Se exporta a 1080×1080 con Chrome headless (escala 4). -->
<html><head><meta charset="utf-8"><style>
@font-face { font-family: Questrial; src: url("Questrial-Regular.ttf"); }
html, body { margin: 0; width: 270px; height: 270px; overflow: hidden; }
body {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
  background: radial-gradient(80% 70% at 50% 40%, #1C222B 0%, #0E131A 70%, #0B1016 100%);
}
.placa { zoom: 1.3;
  width: 128px; aspect-ratio: 1; padding: 3px; border-radius: 25px; box-sizing: content-box;
  background: linear-gradient(145deg, #F8DA7A 0%, #C8951C 32%, #F2C649 58%, #A27716 100%);
  box-shadow: 0 22px 40px -16px rgba(0,0,0,.85), 0 0 34px -10px rgba(240,184,0,.35);
}
.in {
  position: relative; display: flex; align-items: center; justify-content: center;
  width: 100%; height: 100%; border-radius: 22px;
  background: linear-gradient(180deg, #2F3541 0%, #161B23 55%, #10141A 100%);
  font-family: Questrial; font-size: 32px; letter-spacing: .03em; color: #fff;
  text-shadow: 0 2px 8px rgba(0,0,0,.55);
}
.in::before { content: ""; position: absolute; inset: 9px; border: 1px solid rgba(255,255,255,.26); border-radius: 15px; }
.cat { font-family: Questrial; font-size: 13px; letter-spacing: .42em; margin-right: -.42em; text-transform: uppercase; color: #F0B800; }
</style></head><body>
<div class="placa"><div class="in">ECOS</div></div>
</body></html>
